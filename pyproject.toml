[project]
name = "stars"
version = "0.1.0"
description = "Fetch, embed, and cluster GitHub stars into topics for a static site"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
  "sentence-transformers>=5.0",
  "bertopic>=0.17",
  "hdbscan>=0.8.40",
  "umap-learn>=0.5.12",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "tqdm>=4.66",
]

[project.optional-dependencies]
labels = ["anthropic>=0.40"]

[project.scripts]
stars = "stars.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# The CPU-only index only publishes linux/windows wheels; macOS torch wheels
# (used for local dev) are already CPU-only and come from PyPI directly.
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
