name: Build and Deploy

on:
  schedule:
    # Weekly refresh: re-fetch stars, re-cluster, redeploy.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

# Only one Pages deployment at a time; never cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute weekly cache key
        id: cache-key
        run: echo "week=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"

      # README cache + HF model downloads, keyed by ISO week. A cold cache
      # just means one slower run (~15min README fetch), never a failure.
      - name: Cache README + model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            data/cache/readmes
          key: pipeline-cache-${{ steps.cache-key.outputs.week }}
          restore-keys: |
            pipeline-cache-

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install Python dependencies
        run: uv sync

      - name: Run data pipeline (fetch -> enrich -> embed -> topics -> export)
        run: uv run stars all --login ${{ github.repository_owner }}

      - name: Fetch quantized ONNX model for the search island
        run: uv run python scripts/fetch_onnx.py

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Build Astro site
        run: npm run build
        working-directory: site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          SITE_BASE: /${{ github.event.repository.name }}

      - name: Commit updated topic registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/topic_registry.json; then
            git add data/topic_registry.json
            git commit -m "Update topic registry [skip ci]"
            git push
          else
            echo "topic_registry.json unchanged"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
